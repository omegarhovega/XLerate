<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>XLerate — Trace</title>
    <script
      type="text/javascript"
      src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"
    ></script>
    <style>
      /* Inline to avoid fabric-cdn blocking the dialog on slow networks.
       Keep in sync with the trace-table styles in taskpane.css where it matters. */
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: "Segoe UI", sans-serif;
        background: #fff;
        color: #222;
      }
      body {
        padding: 12px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }
      header h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
      }
      #trace-dialog-hint {
        font-size: 11px;
        color: #666;
      }
      #trace-dialog-status {
        font-size: 11px;
        color: #555;
        margin-top: 6px;
        min-height: 14px;
      }
      .trace-context-panel {
        flex: 0 0 auto;
        margin-bottom: 6px;
        padding: 6px 8px;
        border: 1px solid #cfd7df;
        border-left: 4px solid #0563c1;
        border-radius: 4px;
        background: #f8fbff;
      }
      .trace-context-kicker {
        display: block;
        margin-bottom: 1px;
        color: #5b6570;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .trace-breadcrumb {
        display: flex;
        align-items: center;
        gap: 4px;
        min-height: 16px;
        margin: 0 0 3px;
        overflow-x: auto;
        white-space: nowrap;
      }
      .trace-breadcrumb-button {
        max-width: 180px;
        padding: 0;
        overflow: hidden;
        border: 0;
        color: #0563c1;
        background: transparent;
        font: inherit;
        font-size: 10px;
        text-decoration: underline;
        text-overflow: ellipsis;
        white-space: nowrap;
        cursor: pointer;
      }
      .trace-breadcrumb-button[aria-current="location"] {
        color: #333;
        font-weight: 700;
        text-decoration: none;
        cursor: default;
      }
      .trace-breadcrumb-separator {
        color: #8a949e;
        font-size: 10px;
      }
      .trace-context-formula {
        max-height: 60px;
        padding: 5px 6px;
        overflow: auto;
        border: 1px solid #dce3ea;
        border-radius: 3px;
        background: #fff;
        font-family: Consolas, "Courier New", monospace;
        font-size: 11px;
        line-height: 1.35;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }
      .trace-table-wrap {
        flex: 1;
        min-height: 120px;
        overflow: auto;
        border: 1px solid #e3e3e3;
        border-radius: 4px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }
      th,
      td {
        border-bottom: 1px solid #efefef;
        text-align: left;
        padding: 6px 8px;
        vertical-align: top;
      }
      thead th {
        position: sticky;
        top: 0;
        background: #fafafa;
      }
      tr.trace-row-clickable {
        cursor: pointer;
        outline: none;
      }
      tr.trace-row-clickable:hover {
        background: #f5f9ff;
      }
      tr.trace-row-clickable.trace-row-focused {
        background: #e6fbf8;
        box-shadow: inset 0 0 0 2px #00f2da;
      }
      /* Tree indent + chevron. Indent width scales with --indent-level
       (0 = root). The chevron sits between indent and the address
       text; leaves get an invisible spacer so columns line up. */
      .trace-address-cell {
        white-space: nowrap;
      }
      .trace-indent {
        display: inline-block;
        width: calc(var(--indent-level, 0) * 16px);
      }
      .trace-chevron {
        display: inline-block;
        width: 14px;
        cursor: pointer;
        user-select: none;
        text-align: center;
        color: #888;
        font-size: 10px;
        line-height: 1;
      }
      .trace-chevron:hover {
        color: #0f5ea8;
      }
      .trace-chevron-leaf {
        color: #ccc;
        cursor: default;
        font-size: 8px;
      }
      .trace-address-text {
        margin-left: 4px;
      }
      .trace-load-more {
        margin-left: 6px;
        border: 1px solid #b8b8b8;
        border-radius: 3px;
        padding: 1px 6px;
        background: #fff;
        color: #333;
        font: inherit;
        cursor: pointer;
      }
      .trace-load-more:hover {
        background: #f3f3f3;
      }
      .trace-formula-cell {
        white-space: pre-wrap;
      }
      .trace-formula-reference {
        border: 0;
        padding: 0;
        margin: 0;
        background: transparent;
        color: #0563c1;
        font: inherit;
        text-decoration: underline;
        cursor: pointer;
      }
      .trace-formula-reference:hover,
      .trace-formula-reference:focus-visible {
        color: #003e78;
        background: #e8f2ff;
        outline: 1px solid #0563c1;
        outline-offset: 1px;
      }
      .trace-formula-reference.trace-formula-reference-active {
        padding: 1px 3px;
        color: #6f3d00;
        background: #ffe49a;
        box-shadow: inset 0 0 0 1px #d28a00;
        font-weight: 700;
        text-decoration: none;
      }
      .trace-formula-external {
        color: #007c91;
        text-decoration: underline dotted;
        text-underline-offset: 2px;
        cursor: help;
      }
      @media (max-width: 520px) {
        header {
          align-items: stretch;
          flex-direction: column;
        }
        #trace-dialog-hint {
          line-height: 1.35;
        }
        .trace-context-formula {
          max-height: 80px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1 id="trace-dialog-title">Trace</h1>
      <span id="trace-dialog-hint"
        >↑/↓ navigate · →/← expand/collapse · Enter keep · Esc restore</span
      >
    </header>
    <section class="trace-context-panel" aria-label="Formula context">
      <span class="trace-context-kicker">Formula context</span>
      <nav
        id="trace-context-breadcrumb"
        class="trace-breadcrumb"
        aria-label="Trace breadcrumb"
      ></nav>
      <div id="trace-context-formula" class="trace-context-formula">Loading formula…</div>
    </section>
    <div class="trace-table-wrap">
      <table>
        <thead>
          <tr>
            <th>Cell</th>
            <th>Value</th>
            <th>Formula</th>
          </tr>
        </thead>
        <tbody
          id="trace-dialog-body"
          role="tree"
          aria-label="Trace results (↑/↓ navigate, → expand, ← collapse, Enter keeps selection, Escape restores root)"
        >
          <tr>
            <td colspan="3">Loading…</td>
          </tr>
        </tbody>
      </table>
    </div>
    <div id="trace-dialog-status">Initializing…</div>
  </body>
</html>
